<!DOCTYPE html>
<html lang="he" dir="rtl">

  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http://*:*">
    <title>מדריך Pipeline</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
      :root {
        --bg: #0d1117;
        --bg2: #161b22;
        --bg3: #21262d;
        --bg4: #2d333b;
        --bd: #30363d;
        --accent: #58a6ff;
        --green: #3fb950;
        --yellow: #d29922;
        --red: #f85149;
        --purple: #bc8cff;
        --text: #c9d1d9;
        --muted: #8b949e;
        --bright: #f0f6fc;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }

      ::-webkit-scrollbar {
        width: 5px
      }

      ::-webkit-scrollbar-thumb {
        background: var(--bd);
        border-radius: 3px
      }

      /* ── LTR islands (code / editor / log) ── */
      code, pre, .md pre, .ed, #lo {
        direction: ltr;
        unicode-bidi: embed;
        text-align: left;
      }

      /* ── Titlebar ── */
      #tb {
        height: 38px;
        background: var(--bg2);
        border-bottom: 1px solid var(--bd);
        display: flex;
        align-items: center;
        padding: 0 12px;
        -webkit-app-region: drag;
        flex-shrink: 0;
        gap: 8px;
      }

      .tb-logo {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        color: var(--bright);
        font-size: 13px;
      }

      .tb-status {
        margin-inline-start: 10px;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--muted);
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }

      .dot.on {
        background: var(--green);
        box-shadow: 0 0 6px var(--green);
      }

      .tb-sp {
        flex: 1
      }

      .tb-btn {
        -webkit-app-region: no-drag;
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .15s, color .15s;
      }

      .tb-btn:hover {
        background: var(--bg3);
        color: var(--text);
      }

      .tb-btn.x:hover {
        background: var(--red);
        color: #fff;
      }

      /* ── Screens ── */
      .sc {
        display: none;
      }

      .sc.on {
        display: flex;
        flex-direction: column;
        flex: 1;
        overflow: hidden;
      }

      /* ── Login ── */
      #ls {
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }

      .card {
        background: var(--bg2);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 32px;
        width: 420px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
      }

      .card-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--bright);
        margin-bottom: 3px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .card-sub {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 22px;
      }

      .fr {
        margin-bottom: 13px;
      }

      .fr label {
        display: block;
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .05em;
        margin-bottom: 5px;
      }

      .fr input,
      .fr select {
        width: 100%;
        background: var(--bg3);
        border: 1px solid var(--bd);
        border-radius: 6px;
        color: var(--text);
        padding: 8px 10px;
        font-size: 13px;
        outline: none;
        font-family: inherit;
        transition: border-color .15s;
      }

      .fr input:focus,
      .fr select:focus {
        border-color: var(--accent);
      }

      .fr input::placeholder {
        color: var(--muted);
      }

      .fr input[readonly] {
        opacity: .6;
        cursor: default;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 76px;
        gap: 8px;
      }

      .auth-tabs,
      .mode-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 13px;
      }

      .atab,
      .mtab {
        flex: 1;
        padding: 6px;
        border: 1px solid var(--bd);
        background: transparent;
        color: var(--muted);
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
        transition: all .15s;
      }

      .atab.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      .mtab.on {
        background: var(--purple);
        border-color: var(--purple);
        color: #fff;
        font-weight: 600;
      }

      .sec-divider {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .07em;
        color: var(--muted);
        margin: 4px 0 10px;
        padding-top: 10px;
        border-top: 1px solid var(--bd);
      }

      .btn-p {
        width: 100%;
        padding: 10px;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        margin-top: 4px;
        transition: opacity .15s;
      }

      .btn-p:hover {
        opacity: .87
      }

      .btn-p:disabled {
        opacity: .4;
        cursor: not-allowed;
      }

      .btn-s {
        padding: 7px 13px;
        background: var(--bg3);
        border: 1px solid var(--bd);
        border-radius: 6px;
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
        transition: all .15s;
      }

      .btn-s:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .err-box {
        background: rgba(248, 81, 73, .1);
        border: 1px solid rgba(248, 81, 73, .4);
        border-radius: 6px;
        padding: 8px 12px;
        color: var(--red);
        font-size: 12px;
        margin-top: 10px;
        display: none;
      }

      .err-box.on {
        display: block;
      }

      /* ── App layout ── */
      #ws {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ── Sidebar ── */
      #sb {
        width: 238px;
        flex-shrink: 0;
        background: var(--bg2);
        border-inline-end: 1px solid var(--bd);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .sb-sec {
        padding: 8px 0;
        border-bottom: 1px solid var(--bd);
      }

      .sb-sec:last-child {
        border: none;
      }

      .sb-lbl {
        padding: 4px 14px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .07em;
        color: var(--muted);
      }

      .sb-item {
        padding: 6px 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: 12px;
        transition: background .1s;
      }

      .sb-item:hover {
        background: var(--bg3);
      }

      .sb-item.on {
        background: rgba(88, 166, 255, .12);
        color: var(--accent);
      }

      .badge {
        margin-inline-start: auto;
        font-size: 10px;
        background: var(--bg4);
        color: var(--muted);
        padding: 1px 6px;
        border-radius: 10px;
      }

      .sb-item.on .badge {
        background: rgba(88, 166, 255, .2);
        color: var(--accent);
      }

      #sb-foot {
        padding: 10px 12px;
        border-top: 1px solid var(--bd);
        margin-top: auto;
      }

      .ci {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 6px;
        overflow: hidden;
      }

      .ci span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .disc {
        width: 100%;
        padding: 6px;
        background: rgba(248, 81, 73, .1);
        border: 1px solid rgba(248, 81, 73, .3);
        border-radius: 5px;
        color: var(--red);
        font-size: 11px;
        cursor: pointer;
        font-family: inherit;
        transition: all .15s;
      }

      .disc:hover {
        background: rgba(248, 81, 73, .2);
      }

      .admin-btn {
        width: 100%;
        padding: 6px;
        background: transparent;
        border: 1px solid var(--bd);
        border-radius: 5px;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
        font-family: inherit;
        transition: all .15s;
        margin-bottom: 6px;
      }
      .admin-btn:hover { background: var(--bg3); color: var(--text); }

      /* ── Admin panel ── */
      #ap-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.6);
        z-index: 500;
        align-items: center;
        justify-content: center;
      }
      #ap-overlay.on { display: flex; }
      #ap-box {
        background: var(--bg2);
        border: 1px solid var(--bd);
        border-radius: 10px;
        width: 760px;
        max-width: 94vw;
        max-height: 82vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 8px 32px rgba(0,0,0,.5);
      }
      #ap-head {
        display: flex;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid var(--bd);
        gap: 10px;
        flex-shrink: 0;
      }
      #ap-head h2 { flex:1; font-size:14px; color:var(--bright); font-weight:600; }
      #ap-stats { font-size:11px; color:var(--muted); }
      .ap-close {
        width:26px; height:26px; border:none; background:transparent;
        color:var(--muted); cursor:pointer; border-radius:4px; font-size:14px;
        display:flex; align-items:center; justify-content:center;
      }
      .ap-close:hover { background:var(--bg3); color:var(--text); }
      #ap-body { overflow-y:auto; flex:1; }
      .ap-table { width:100%; border-collapse:collapse; font-size:12px; }
      .ap-table th {
        text-align:start; padding:8px 14px; font-size:10px; font-weight:700;
        text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
        border-bottom:1px solid var(--bd); position:sticky; top:0;
        background:var(--bg2); cursor:pointer; user-select:none;
      }
      .ap-table th:hover { color:var(--text); }
      .ap-table td { padding:8px 14px; border-bottom:1px solid var(--bd); vertical-align:middle; }
      .ap-table tr:last-child td { border-bottom:none; }
      .ap-table tr:hover td { background:var(--bg3); }
      .ap-stale td { color:var(--red) !important; }
      .ap-stale .ap-path { color:rgba(248,81,73,.7) !important; }
      .ap-warn td { color:var(--yellow) !important; }
      .ap-warn .ap-path { color:rgba(210,153,34,.7) !important; }
      .ap-path { font-size:11px; color:var(--muted); }
      .ap-age-badge {
        display:inline-block; padding:2px 7px; border-radius:10px;
        font-size:10px; font-weight:600;
      }
      .ap-age-stale { background:rgba(248,81,73,.15); color:var(--red); }
      .ap-age-warn  { background:rgba(210,153,34,.15); color:var(--yellow); }
      .ap-age-ok    { background:rgba(63,185,80,.15); color:var(--green); }
      .ap-sort-ico  { margin-inline-start:4px; opacity:.5; }

      /* ── Main ── */
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
      }

      #toolbar {
        padding: 9px 14px;
        border-bottom: 1px solid var(--bd);
        background: var(--bg2);
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
      }

      .sw {
        flex: 1;
        position: relative;
        max-width: 380px;
      }

      .sw svg {
        position: absolute;
        inset-inline-start: 9px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
      }

      #si {
        width: 100%;
        background: var(--bg3);
        border: 1px solid var(--bd);
        border-radius: 6px;
        color: var(--text);
        padding: 6px 10px;
        padding-inline-start: 30px;
        font-size: 12px;
        outline: none;
        font-family: inherit;
        transition: border-color .15s;
      }

      #si:focus {
        border-color: var(--accent);
      }

      #si::placeholder {
        color: var(--muted);
      }

      .fsel {
        background: var(--bg3);
        border: 1px solid var(--bd);
        border-radius: 6px;
        color: var(--text);
        padding: 6px 10px;
        font-size: 12px;
        outline: none;
        font-family: inherit;
        cursor: pointer;
      }

      .tb-sp2 {
        flex: 1;
      }

      .rbtn {
        padding: 6px 12px;
        background: var(--bg3);
        border: 1px solid var(--bd);
        border-radius: 6px;
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: all .15s;
      }

      .rbtn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .rbtn.spin svg {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Content ── */
      #ct {
        flex: 1;
        overflow-y: auto;
      }

      .gv {
        padding: 20px;
      }

      .gv-hd {
        margin-bottom: 14px;
      }

      .gv-hd h2 {
        font-size: 16px;
        font-weight: 700;
        color: var(--bright);
        margin-bottom: 3px;
      }

      .gv-hd p {
        font-size: 12px;
        color: var(--muted);
      }

      .gg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 11px;
      }

      .gc {
        background: var(--bg2);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 14px;
        cursor: pointer;
        transition: border-color .15s, transform .1s;
      }

      .gc:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      .gc-h {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 7px;
      }

      .gc-ico {
        font-size: 20px;
        flex-shrink: 0;
      }

      .gc-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--bright);
        line-height: 1.3;
      }

      .gc-cat {
        font-size: 11px;
        color: var(--accent);
        margin-top: 2px;
      }

      .gc-desc {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 9px;
      }

      .gc-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .tag {
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 10px;
        background: var(--bg3);
        color: var(--muted);
        border: 1px solid var(--bd);
      }

      .tag.ac {
        background: rgba(88, 166, 255, .1);
        color: var(--accent);
        border-color: rgba(88, 166, 255, .3);
      }

      .es {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        color: var(--muted);
        gap: 10px;
        text-align: center;
      }

      .es-i {
        font-size: 40px;
        opacity: .35;
      }

      .es h3 {
        font-size: 14px;
        color: var(--text);
      }

      .es p {
        font-size: 12px;
        max-width: 280px;
        line-height: 1.5;
      }

      .spin2 {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 2px solid var(--bd);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin .7s linear infinite;
      }

      /* ── Guide Viewer ── */
      .gview {
        padding: 24px 28px;
        max-width: 880px;
      }

      .gnav {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 18px;
        font-size: 12px;
        color: var(--muted);
      }

      .gnav a {
        color: var(--accent);
        cursor: pointer;
      }

      .gnav a:hover {
        text-decoration: underline;
      }

      .gview h1 {
        font-size: 22px;
        font-weight: 700;
        color: var(--bright);
        margin-bottom: 8px;
      }

      .gmeta {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 14px;
      }

      .act-bar {
        display: flex;
        gap: 7px;
        margin-bottom: 16px;
      }

      .pbar-w {
        margin: 14px 0;
      }

      .pbar-l {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
        display: flex;
        justify-content: space-between;
      }

      .pbar {
        height: 4px;
        background: var(--bg3);
        border-radius: 2px;
        overflow: hidden;
      }

      .pfill {
        height: 100%;
        background: var(--green);
        border-radius: 2px;
        transition: width .3s;
      }

      .steps-lbl {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--muted);
        margin: 16px 0 10px;
      }

      .step {
        border: 1px solid var(--bd);
        border-radius: 8px;
        margin-bottom: 9px;
        overflow: hidden;
        transition: border-color .15s;
      }

      .step.done {
        border-color: rgba(63, 185, 80, .3);
        background: rgba(63, 185, 80, .03);
      }

      .step.open {
        border-color: var(--accent);
      }

      .step-hd {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        cursor: pointer;
        background: var(--bg2);
        transition: background .1s;
      }

      .step-hd:hover {
        background: var(--bg3);
      }

      .chk {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid var(--bd);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        transition: all .2s;
        cursor: pointer;
      }

      .chk:hover {
        border-color: var(--accent);
      }

      .step.done .chk {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
        font-size: 12px;
      }

      .snum {
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
      }

      .stitle {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
        color: var(--bright);
      }

      .step.done .stitle {
        color: var(--muted);
        text-decoration: line-through;
      }

      .sarr {
        color: var(--muted);
        font-size: 10px;
        transition: transform .2s;
      }

      .step.open .sarr {
        transform: rotate(90deg);
      }

      .sbody {
        display: none;
        padding: 14px 16px;
        padding-inline-start: 46px;
        border-top: 1px solid var(--bd);
      }

      .step.open .sbody {
        display: block;
      }

      /* ── Markdown ── */
      .md h1,
      .md h2,
      .md h3 {
        color: var(--bright);
        font-weight: 600;
        margin: 14px 0 7px;
      }

      .md h1 {
        font-size: 20px;
      }

      .md h2 {
        font-size: 16px;
      }

      .md h3 {
        font-size: 14px;
      }

      .md p {
        margin-bottom: 9px;
        line-height: 1.65;
      }

      .md code {
        font-family: 'SFMono-Regular', Consolas, monospace;
        font-size: 12px;
        background: var(--bg3);
        border: 1px solid var(--bd);
        border-radius: 4px;
        padding: 1px 5px;
        color: var(--purple);
      }

      .md pre {
        background: var(--bg2);
        border: 1px solid var(--bd);
        border-radius: 6px;
        padding: 12px 14px;
        overflow-x: auto;
        margin: 9px 0;
      }

      .md pre code {
        background: none;
        border: none;
        padding: 0;
        color: var(--green);
      }

      .md ul,
      .md ol {
        padding-inline-start: 20px;
        margin-bottom: 9px;
      }

      .md li {
        margin-bottom: 4px;
        line-height: 1.55;
      }

      .md blockquote {
        border-inline-start: 3px solid var(--accent);
        padding: 6px 14px;
        margin: 9px 0;
        color: var(--muted);
        background: rgba(88, 166, 255, .06);
        border-radius: 6px;
      }

      .md a {
        color: var(--accent);
      }

      .md table {
        width: 100%;
        border-collapse: collapse;
        margin: 9px 0;
        font-size: 12px;
      }

      .md th,
      .md td {
        border: 1px solid var(--bd);
        padding: 6px 11px;
        text-align: start;
      }

      .md th {
        background: var(--bg2);
        color: var(--bright);
        font-weight: 600;
      }

      .md tr:hover td {
        background: var(--bg3);
      }

      .md hr {
        border: none;
        border-top: 1px solid var(--bd);
        margin: 14px 0;
      }

      .md img {
        max-width: 100%;
        border-radius: 6px;
        border: 1px solid var(--bd);
        margin: 10px 0;
        display: block;
      }

      .img-warn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--yellow);
        padding: 5px 10px;
        background: rgba(210, 153, 34, .08);
        border: 1px solid rgba(210, 153, 34, .25);
        border-radius: 6px;
        margin: 4px 0;
      }

      /* ── Log Panel ── */
      #lp {
        border-top: 1px solid var(--bd);
        background: var(--bg2);
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        height: 175px;
        transition: height .2s;
      }

      #lp.col {
        height: 32px;
      }

      #lp.col #lo {
        display: none;
      }

      #lh {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
        height: 32px;
        border-bottom: 1px solid var(--bd);
        flex-shrink: 0;
        cursor: pointer;
        user-select: none;
      }

      .ldot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
      }

      .ldot.live {
        background: var(--green);
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {

        0%,
        100% {
          opacity: 1
        }

        50% {
          opacity: .35
        }
      }

      .ltitle {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--muted);
      }

      .lsp {
        flex: 1;
      }

      .lbtn {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 3px;
        display: flex;
        align-items: center;
        border-radius: 3px;
      }

      .lbtn:hover {
        background: var(--bg3);
        color: var(--text);
      }

      #lo {
        flex: 1;
        overflow-y: auto;
        padding: 7px 12px;
        font-family: 'SFMono-Regular', Consolas, monospace;
        font-size: 11.5px;
        line-height: 1.5;
      }

      .ll {
        display: flex;
        gap: 8px;
      }

      .lt {
        color: var(--muted);
        flex-shrink: 0;
      }

      .lx {
        word-break: break-all;
      }

      .lx.e {
        color: var(--red);
      }

      .lx.s {
        color: var(--accent);
        font-style: italic;
      }

      /* ── Guide Editor Modal ── */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .72);
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
      }

      .modal {
        background: var(--bg2);
        border: 1px solid var(--bd);
        border-radius: 10px;
        width: 720px;
        max-width: 95vw;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 16px 48px rgba(0, 0, 0, .6);
      }

      .modal-hd {
        padding: 14px 16px;
        border-bottom: 1px solid var(--bd);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .modal-hd h3 {
        font-size: 14px;
        font-weight: 600;
        color: var(--bright);
        margin: 0;
      }

      .modal-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .modal-ft {
        padding: 12px 16px;
        border-top: 1px solid var(--bd);
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-shrink: 0;
      }

      .ed {
        width: 100%;
        flex: 1;
        min-height: 320px;
        background: var(--bg3);
        border: 1px solid var(--bd);
        border-radius: 6px;
        color: var(--text);
        padding: 10px 12px;
        font-family: 'SFMono-Regular', Consolas, monospace;
        font-size: 12px;
        line-height: 1.6;
        resize: none;
        outline: none;
        transition: border-color .15s;
      }

      .ed:focus {
        border-color: var(--accent);
      }

      .btn-danger {
        padding: 6px 12px;
        background: rgba(248, 81, 73, .1);
        border: 1px solid rgba(248, 81, 73, .3);
        border-radius: 6px;
        color: var(--red);
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
        transition: all .15s;
      }

      .btn-danger:hover {
        background: rgba(248, 81, 73, .2);
      }

      .api-badge {
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 10px;
        background: rgba(188, 140, 255, .1);
        color: var(--purple);
        border: 1px solid rgba(188, 140, 255, .3);
        margin-inline-start: 6px;
      }

      .icon-pick {
        position: absolute;
        top: 58px;
        inset-inline-start: 0;
        z-index: 200;
        background: var(--bg2);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, .5);
        display: none;
      }

      .icon-pick-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
      }

      .icon-pick button {
        font-size: 17px;
        width: 30px;
        height: 30px;
        border: none;
        background: transparent;
        cursor: pointer;
        border-radius: 4px;
        line-height: 1;
      }

      .icon-pick button:hover {
        background: var(--bg3);
      }

      .rbtn.on {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(88, 166, 255, .08);
      }

      /* ── Tag dropdown ── */
      .tag-dd {
        position: relative;
      }

      .tag-dd-list {
        position: absolute;
        top: calc(100% + 3px);
        inset-inline-start: 0;
        min-width: 160px;
        max-height: 200px;
        overflow-y: auto;
        background: var(--bg2);
        border: 1px solid var(--bd);
        border-radius: 6px;
        z-index: 50;
        box-shadow: 0 4px 12px rgba(0, 0, 0, .45);
        display: none;
      }

      .tag-dd-item {
        padding: 6px 12px;
        cursor: pointer;
        font-size: 12px;
        color: var(--text);
        white-space: nowrap;
      }

      .tag-dd-item:hover {
        background: var(--bg3);
      }

      .tag-dd-item.on {
        color: var(--accent);
      }

      /* ── Subcategory sidebar ── */
      .sb-sub {
        padding: 5px 14px;
        padding-inline-start: 30px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 11px;
        transition: background .1s;
      }

      .sb-sub:hover {
        background: var(--bg3);
        color: var(--text);
      }

      .sb-sub.on {
        background: rgba(88, 166, 255, .1);
        color: var(--accent);
      }
      .sb-cat-ico { border-radius:3px; padding:1px 3px; cursor:pointer; }
      .sb-cat-ico:hover { background:var(--bg4); outline:1px solid var(--bd); }
      .sb-chev { margin-inline-start:2px; color:var(--muted); font-size:11px; padding:2px 5px; border-radius:3px; transition:transform .18s; display:inline-block; cursor:pointer; }
      .sb-chev:hover { background:var(--bg4); color:var(--text); }
      .sb-chev.open { transform:rotate(90deg); }
    </style>
  </head>

  <body>

    <!-- TITLEBAR -->
    <div id="tb">
      <div class="tb-logo">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
        מדריך Pipeline
      </div>
      <div class="tb-status">
        <div class="dot" id="cd"></div><span id="cl">מנותק</span>
      </div>
      <div class="tb-sp"></div>
      <button class="tb-btn" onclick="api.minimize()" title="מזעור">
        <svg width="12" height="2" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 12 2">
          <line x1="0" y1="1" x2="12" y2="1" />
        </svg>
      </button>
      <button class="tb-btn" onclick="api.maximize()" title="הגדלה">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 11 11">
          <rect x=".5" y=".5" width="10" height="10" rx="2" />
        </svg>
      </button>
      <button class="tb-btn x" onclick="api.close()" title="סגירה">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 11 11">
          <line x1="1" y1="1" x2="10" y2="10" />
          <line x1="10" y1="1" x2="1" y2="10" />
        </svg>
      </button>
    </div>

    <!-- LOGIN -->
    <div id="ls" class="sc on">
      <div class="card">
        <div class="card-title">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          התחבר לשרת מדריכים
        </div>
        <div class="card-sub">הזן את פרטי השרת ואישורי הכניסה</div>

        <div class="fr">
          <label>כתובת שרת ופורט</label>
          <div class="split">
            <input type="text" id="fh" placeholder="שם מארח או IP" autocomplete="off">
            <input type="number" id="fp" value="7842" placeholder="7842">
          </div>
        </div>
        <div class="fr"><label>שם משתמש</label><input type="text" id="fu" placeholder="שם משתמש" autocomplete="off"></div>
        <div class="fr"><label>סיסמה</label><input type="password" id="fpass" placeholder="••••••••" onkeydown="if(event.key==='Enter')app.connect()"></div>

        <div id="lerr" class="err-box"></div>
        <button class="btn-p" id="cbtn" onclick="app.connect()">התחבר</button>
      </div>
    </div>

    <!-- APP -->
    <div id="as" class="sc">
      <div id="ws">
        <div id="sb">
          <div class="sb-sec">
            <div class="sb-lbl">עיון</div>
            <div class="sb-item on" id="nall" onclick="app.nav.home()">🏠 עיון<span class="badge" id="ball">0</span></div>
            <div class="sb-item" id="nrec" onclick="app.nav.recent()">🕐 נצפו לאחרונה</div>
          </div>
          <div class="sb-sec" style="flex:1;overflow-y:auto">
            <div class="sb-lbl">קטגוריות</div>
            <div id="cats"></div>
          </div>
          <div id="sb-foot">
            <div class="ci">🔒 <span id="cinfo">—</span></div>
            <button class="admin-btn" id="ap-btn" style="display:none" onclick="app.admin.open()">📋 רעננות מדריכים</button>
            <button class="disc" onclick="app.disconnect()">⏏ התנתק</button>
          </div>
        </div>

        <div id="main">
          <div id="toolbar">
            <button class="rbtn" id="back-btn" style="display:none" onclick="app.nav.back()" title="חזרה">חזרה ›</button>
            <div class="sw">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input type="text" id="si" placeholder="חיפוש בכל המדריכים... (Ctrl+F)" oninput="app.onSearch(this.value)">
            </div>
            <div class="tag-dd" id="tag-dd">
              <button class="fsel" id="tag-dd-btn" onclick="app.sidebar.togTagDd(event)">כל התגים ▾</button>
              <div class="tag-dd-list" id="tag-dd-list"></div>
            </div>
            <div class="tb-sp2"></div>
            <button class="rbtn" id="ngb" style="display:none" onclick="app.editor.open('create')" title="מדריך חדש">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              מדריך חדש
            </button>
            <button class="rbtn" id="rb" onclick="app.loadGuides()">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M23 4v6h-6M1 20v-6h6" />
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
              </svg>
              רענן
            </button>
          </div>
          <div id="ct"></div>
        </div>
      </div>

      <div id="lp">
        <div id="lh" onclick="app.logger.toggle()">
          <div class="ldot" id="ldot"></div>
          <span class="ltitle">יומן פלט</span>
          <div class="lsp"></div>
          <button class="lbtn" onclick="app.logger.clear(event)" title="נקה יומן">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6l-1 14H6L5 6" />
              <path d="M10 11v6M14 11v6M9 6V4h6v2" />
            </svg>
          </button>
          <button class="lbtn" title="הצג/הסתר">
            <svg id="ltogico" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <polyline points="18 15 12 9 6 15" />
            </svg>
          </button>
        </div>
        <div id="lo"></div>
      </div>
    </div>

    <!-- GUIDE EDITOR MODAL -->
    <div class="overlay" id="ed-overlay" onclick="app.editor.overlayClick(event)">
      <div class="modal">
        <div class="modal-hd">
          <h3 id="em-title">מדריך חדש</h3>
          <button class="tb-btn" onclick="app.editor.close()" title="סגירה">
            <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 11 11">
              <line x1="1" y1="1" x2="10" y2="10" />
              <line x1="10" y1="1" x2="1" y2="10" />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="fr" style="margin:0">
            <label>נתיב (יחסי לתיקיית מדריכים)</label>
            <input type="text" id="em-path" placeholder="קטגוריה/תת-תיקיה/מדריך.md" autocomplete="off">
          </div>
          <div class="fr" style="margin:0; position:relative">
            <label>אייקון</label>
            <div style="display:flex;align-items:center;gap:8px">
              <button class="btn-s" id="em-icon-btn" onclick="app.editor.togIcons(event)"
                style="font-size:20px;width:38px;height:34px;padding:0;text-align:center">📄</button>
              <span style="font-size:11px;color:var(--muted)">מאוחסן ב-frontmatter — לחץ לשינוי</span>
            </div>
            <div class="icon-pick" id="em-icon-picker">
              <div class="icon-pick-grid" id="em-icon-grid"></div>
            </div>
          </div>
          <textarea class="ed" id="em-content" placeholder="# Guide Title&#10;&#10;## Step 1: ...&#10;&#10;Description here."></textarea>
        </div>
        <div class="modal-ft">
          <button class="btn-s" id="em-img" onclick="app.editor.insertImage()" title="העלה תמונה והכנס קישור markdown">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
              style="display:inline;vertical-align:middle;margin-inline-end:4px">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
            הוסף תמונה
          </button>
          <div style="flex:1"></div>
          <button class="btn-s" onclick="app.editor.close()">ביטול</button>
          <button class="btn-p" id="em-save" onclick="app.editor.save()" style="width:auto;padding:8px 20px">שמור</button>
        </div>
      </div>
    </div>

    <!-- Floating icon picker (shared for category icons) -->
    <div id="float-icon-picker" style="position:fixed;display:none;z-index:600;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.55)">
      <div id="float-icon-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px"></div>
    </div>

    <!-- Admin panel overlay -->
    <div id="ap-overlay" onclick="app.admin.overlayClick(event)">
      <div id="ap-box">
        <div id="ap-head">
          <h2>📋 רעננות מדריכים</h2>
          <span id="ap-stats"></span>
          <button class="ap-close" onclick="app.admin.close()">✕</button>
        </div>
        <div id="ap-body">
          <table class="ap-table" id="ap-table">
            <thead>
              <tr>
                <th onclick="app.admin.sort('title')">כותרת <span class="ap-sort-ico" id="aps-title"></span></th>
                <th onclick="app.admin.sort('path')">נתיב <span class="ap-sort-ico" id="aps-path"></span></th>
                <th onclick="app.admin.sort('updatedAt')">עודכן לאחרונה <span class="ap-sort-ico" id="aps-updatedAt">▼</span></th>
                <th onclick="app.admin.sort('age')">גיל <span class="ap-sort-ico" id="aps-age"></span></th>
              </tr>
            </thead>
            <tbody id="ap-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>

</html>
