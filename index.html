<!DOCTYPE html>
<html lang="he" dir="rtl">

  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http://*:*">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <title>מדריך Pipeline</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
      /* ════════════════════════════════════════════════════════════════
         שקט מבצעי (Quiet Ops) — design tokens
         Components consume semantic tokens only. Themes swap the
         semantic layer under html[data-theme]; components never change.
         Contrast: text tiers ≥4.5:1 on their designated surfaces,
         control boundaries (--border-control) ≥3:1 vs adjacent surface.
         ════════════════════════════════════════════════════════════════ */
      :root {
        color-scheme: dark;

        --surface-0: #101216;
        /* app canvas, toolbar, content        */
        --surface-1: #16181d;
        /* titlebar, sidebar, log, code blocks */
        --surface-2: #1c1f26;
        /* cards, inputs, steps, dialogs       */
        --surface-3: #242832;
        /* hover / raised / chips              */

        --border-subtle: #262b34;
        /* hairlines, decorative edges      */
        --border-strong: #363d4a;
        /* hover edges, dividers            */
        --border-control: #626e82;
        /* input & checkbox boundaries ≥3:1 */

        --text-primary: #e8eaf0;
        /* 13.9:1 on surface-0 */
        --text-secondary: #a9b1bf;
        /*  7.4:1              */
        --text-tertiary: #808a9c;
        /*  4.7:1 on surface-2; never on surface-3 */

        --accent-text: #8fb4f7;
        /* links, active nav — 7.9:1 */
        --accent-bg: #3b66c9;
        /* primary buttons, on-accent white 5.3:1 */
        --on-accent: #ffffff;
        --accent-tint: color-mix(in oklch, #3b66c9 14%, transparent);

        --success-text: #5fc46d;
        /* 7.5:1 on surface-2 */
        --success-solid: #2f9e44;
        /* checked fill, white ✓ ≥3:1 */
        --on-success: #ffffff;
        --success-tint: color-mix(in oklch, #2f9e44 14%, transparent);

        --warning-text: #d9a840;
        /* 7.6:1 on surface-2 */
        --warning-tint: color-mix(in oklch, #d9a840 12%, transparent);

        --danger-text: #f0705f;
        /* 5.6:1 on surface-2 */
        --danger-bg: #c93c33;
        /* white on it 5.0:1  */
        --on-danger: #ffffff;
        --danger-tint: color-mix(in oklch, #c93c33 14%, transparent);

        --focus-ring: #8fb4f7;
        --shadow-overlay: 0 16px 48px rgb(0 0 0 / .5), 0 2px 8px rgb(0 0 0 / .35);
        --scrim: rgb(0 0 0 / .6);

        /* type scale — Hebrew: no uppercase, no letter-spacing; weight+color carry hierarchy */
        --fs-xs: 12px;
        /* labels, badges, chips */
        --fs-sm: 13px;
        /* meta, breadcrumbs     */
        --fs-base: 14px;
        /* UI chrome             */
        --fs-md: 15px;
        /* guide prose           */
        --fs-lg: 17px;
        /* section/dialog titles */
        --fs-xl: 20px;
        /* page headers          */
        --fs-2xl: 26px;
        /* guide h1              */

        --r-sm: 6px;
        --r-md: 8px;
        --r-lg: 10px;
        --r-xl: 14px;

        --dur-instant: 80ms;
        --dur-fast: 140ms;
        --dur-standard: 220ms;
        --dur-emph: 360ms;
        --ease-enter: cubic-bezier(.16, 1, .3, 1);
        --ease-move: cubic-bezier(.45, 0, .25, 1);
        --ease-exit: cubic-bezier(.4, 0, 1, 1);
      }

      html[data-theme="light"] {
        color-scheme: light;
        --surface-0: #f7f8fa;
        --surface-1: #ffffff;
        --surface-2: #ffffff;
        --surface-3: #eef0f4;
        --border-subtle: #e4e7ee;
        --border-strong: #c6cddb;
        --border-control: #757f92;
        --text-primary: #1b1f27;
        --text-secondary: #49515f;
        --text-tertiary: #667082;
        --accent-text: #2c56b8;
        --accent-bg: #2c56b8;
        --accent-tint: color-mix(in oklch, #2c56b8 10%, transparent);
        --success-text: #1e7a2b;
        --success-solid: #2b7a3d;
        --success-tint: color-mix(in oklch, #1e7a2b 10%, transparent);
        --warning-text: #8a5a00;
        --warning-tint: color-mix(in oklch, #8a5a00 10%, transparent);
        --danger-text: #c13a31;
        --danger-bg: #c13a31;
        --danger-tint: color-mix(in oklch, #c13a31 10%, transparent);
        --focus-ring: #2c56b8;
        --shadow-overlay: 0 16px 48px rgb(16 24 40 / .14), 0 2px 8px rgb(16 24 40 / .08);
        --scrim: rgb(16 24 40 / .45);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        font-size: var(--fs-base);
        line-height: 1.5;
        background: var(--surface-0);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
      }

      code,
      pre,
      kbd {
        font-family: "Cascadia Code", Consolas, monospace;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--border-control);
      }

      /* a11y primitives */
      :focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      [hidden] {
        display: none !important;
      }

      /* LTR islands — isolate (not embed) so bidi punctuation doesn't bleed */
      code,
      pre,
      .ed,
      #lo,
      .ltr {
        direction: ltr;
        unicode-bidi: isolate;
        text-align: left;
      }

      .num {
        font-variant-numeric: tabular-nums;
      }

      /* ── chips (shared anatomy: connection / freshness / tags / counts) ── */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: var(--fs-xs);
        font-weight: 500;
        background: var(--surface-3);
        color: var(--text-secondary);
        border: 1px solid transparent;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .chip.ok {
        background: var(--success-tint);
        color: var(--success-text);
      }

      .chip.warn {
        background: var(--warning-tint);
        color: var(--warning-text);
      }

      .chip.bad {
        background: var(--danger-tint);
        color: var(--danger-text);
      }

      .chip.acc {
        background: var(--accent-tint);
        color: var(--accent-text);
      }

      /* ── buttons ── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border-radius: var(--r-md);
        font-family: inherit;
        font-size: var(--fs-base);
        font-weight: 500;
        border: 1px solid transparent;
        cursor: pointer;
        background: transparent;
        color: var(--text-secondary);
        transition: background var(--dur-fast) var(--ease-move), color var(--dur-fast) var(--ease-move), border-color var(--dur-fast) var(--ease-move);
        white-space: nowrap;
      }

      .btn:hover {
        background: var(--surface-3);
        color: var(--text-primary);
      }

      .btn:active {
        transition-duration: var(--dur-instant);
      }

      .btn.sm {
        height: 32px;
        padding: 0 12px;
        font-size: var(--fs-sm);
      }

      .btn.outline {
        border-color: var(--border-strong);
      }

      .btn.primary {
        background: var(--accent-bg);
        color: var(--on-accent);
      }

      .btn.primary:hover {
        background: color-mix(in oklch, var(--accent-bg) 88%, #000);
        color: var(--on-accent);
      }

      .btn.tinted {
        background: var(--accent-tint);
        color: var(--accent-text);
      }

      .btn.tinted:hover {
        background: color-mix(in oklch, var(--accent-bg) 22%, transparent);
        color: var(--accent-text);
      }

      .btn.danger {
        background: var(--danger-bg);
        color: var(--on-danger);
      }

      .btn.danger:hover {
        background: color-mix(in oklch, var(--danger-bg) 88%, #000);
      }

      .btn.ghost-danger {
        color: var(--danger-text);
      }

      .btn.ghost-danger:hover {
        background: var(--danger-tint);
        color: var(--danger-text);
      }

      .btn.icon {
        width: 36px;
        padding: 0;
      }

      .btn.icon.sm {
        width: 32px;
      }

      /* pending: keeps keyboard focus (aria-disabled + pointer-events), width-stable label swap */
      .btn[aria-disabled="true"] {
        opacity: .55;
        pointer-events: none;
      }

      .btn[disabled] {
        opacity: .45;
        cursor: not-allowed;
      }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        border: 2px solid color-mix(in oklch, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin .7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      kbd.kchip {
        font-size: var(--fs-xs);
        padding: 2px 6px;
        border-radius: var(--r-sm);
        background: var(--surface-3);
        color: var(--text-secondary);
        border: 1px solid var(--border-strong);
      }

      /* ── form fields ── */
      .fr {
        margin-bottom: 14px;
      }

      .fr label {
        display: block;
        color: var(--text-secondary);
        font-size: var(--fs-sm);
        font-weight: 600;
        margin-bottom: 6px;
      }

      .fr input,
      .fr textarea,
      .fr select {
        width: 100%;
        height: 40px;
        background: var(--surface-3);
        border: 1px solid var(--border-control);
        border-radius: var(--r-md);
        color: var(--text-primary);
        padding: 0 12px;
        font-size: var(--fs-base);
        font-family: inherit;
      }

      html[data-theme="light"] .fr input,
      html[data-theme="light"] .fr textarea {
        background: var(--surface-0);
      }

      .fr input::placeholder,
      .fr textarea::placeholder {
        color: var(--text-tertiary);
      }

      .fr input[readonly] {
        opacity: .6;
      }

      .fr input[aria-invalid="true"] {
        border-color: var(--danger-text);
      }

      .fr .msg {
        font-size: var(--fs-xs);
        color: var(--danger-text);
        margin-top: 5px;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 88px;
        gap: 8px;
      }

      .err-box {
        display: none;
        align-items: flex-start;
        gap: 8px;
        background: var(--danger-tint);
        border: 1px solid color-mix(in oklch, var(--danger-text) 40%, transparent);
        border-radius: var(--r-md);
        padding: 10px 12px;
        color: var(--danger-text);
        font-size: var(--fs-sm);
        margin-top: 12px;
      }

      .err-box.on {
        display: flex;
      }

      /* ── titlebar ── */
      #tb {
        height: 40px;
        background: var(--surface-1);
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 10px;
        -webkit-app-region: drag;
        flex-shrink: 0;
      }

      .tb-logo {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
        color: var(--text-primary);
        font-size: var(--fs-sm);
      }

      .tb-logo svg {
        color: var(--accent-text);
      }

      #conn-chip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        flex-shrink: 0;
      }

      .tb-sp {
        flex: 1;
      }

      .tb-btn {
        -webkit-app-region: no-drag;
        width: 44px;
        height: 40px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background var(--dur-fast), color var(--dur-fast);
      }

      .tb-btn:hover {
        background: var(--surface-3);
        color: var(--text-primary);
      }

      .tb-btn.x:hover {
        background: var(--danger-bg);
        color: var(--on-danger);
      }

      .tb-btn:focus-visible {
        outline-offset: -2px;
      }

      /* ── screens ── */
      .sc {
        display: none;
      }

      .sc.on {
        display: flex;
        flex-direction: column;
        flex: 1;
        overflow: hidden;
      }

      /* ── login ── */
      #ls {
        align-items: center;
        justify-content: center;
      }

      .card {
        background: var(--surface-2);
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-xl);
        padding: 36px;
        width: 440px;
        box-shadow: var(--shadow-overlay);
      }

      .card-title {
        font-size: var(--fs-lg);
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .card-title svg {
        color: var(--accent-text);
        flex-shrink: 0;
      }

      .card-sub {
        color: var(--text-secondary);
        font-size: var(--fs-base);
        margin-bottom: 24px;
      }

      #cbtn {
        width: 100%;
        height: 44px;
        font-size: var(--fs-md);
        font-weight: 600;
        margin-top: 6px;
      }

      /* ── workspace layout ── */
      #ws {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--surface-0);
        min-width: 0;
      }

      #ct {
        flex: 1;
        overflow-y: auto;
        scroll-behavior: smooth;
      }

      /* ── sidebar ── */
      #sb {
        width: 256px;
        flex-shrink: 0;
        background: var(--surface-1);
        border-inline-end: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .sb-sec {
        padding: 8px 0;
        border-bottom: 1px solid var(--border-subtle);
      }

      .sb-scroll {
        flex: 1;
        overflow-y: auto;
        border-bottom: none;
      }

      .sb-lbl {
        padding: 8px 16px 4px;
        font-size: var(--fs-xs);
        font-weight: 600;
        color: var(--text-tertiary);
      }

      .sb-row {
        display: flex;
        align-items: center;
        margin-inline: 8px;
        border-radius: var(--r-sm);
        position: relative;
      }

      .sb-row:hover {
        background: var(--surface-3);
      }

      .sb-item {
        flex: 1;
        min-height: 34px;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        border: none;
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--text-secondary);
        font-family: inherit;
        font-size: var(--fs-base);
        text-align: start;
        cursor: pointer;
      }

      .sb-row:hover .sb-item {
        color: var(--text-primary);
      }

      .sb-row.on {
        background: var(--accent-tint);
      }

      .sb-row.on::before {
        content: '';
        position: absolute;
        inset-inline-start: 0;
        top: 7px;
        bottom: 7px;
        width: 2px;
        border-radius: 2px;
        background: var(--accent-text);
      }

      .sb-row.on .sb-item {
        color: var(--accent-text);
        font-weight: 600;
      }

      .sb-ico {
        width: 24px;
        text-align: center;
        flex-shrink: 0;
        font-size: 15px;
      }

      .sb-txt {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge {
        font-size: var(--fs-xs);
        font-variant-numeric: tabular-nums;
        background: var(--surface-3);
        color: var(--text-secondary);
        padding: 1px 8px;
        border-radius: 999px;
        flex-shrink: 0;
      }

      .sb-row.on .badge {
        background: color-mix(in oklch, var(--accent-bg) 22%, transparent);
        color: var(--accent-text);
      }

      .sb-aux {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        margin-inline-end: 4px;
        border: none;
        background: transparent;
        border-radius: var(--r-sm);
        color: var(--text-secondary);
        cursor: pointer;
        font-size: var(--fs-sm);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .sb-aux:hover {
        background: var(--surface-2);
        color: var(--text-primary);
      }

      .sb-chev {
        transition: transform var(--dur-fast) var(--ease-move);
        display: inline-block;
      }

      .sb-aux[aria-expanded="true"] .sb-chev {
        transform: rotate(-90deg);
      }

      .sb-edit {
        visibility: hidden;
      }

      .sb-row:hover .sb-edit,
      .sb-row:focus-within .sb-edit {
        visibility: visible;
      }

      .sb-group {
        border-inline-start: 1px solid var(--border-subtle);
        margin-inline-start: 20px;
      }

      #sb-foot {
        padding: 12px;
        border-top: 1px solid var(--border-subtle);
        margin-top: auto;
        display: grid;
        gap: 8px;
      }

      .ci {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: var(--fs-sm);
        color: var(--text-secondary);
        overflow: hidden;
      }

      .ci span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .theme-seg {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }

      .theme-seg .btn {
        height: 28px;
        font-size: var(--fs-xs);
        padding: 0;
      }

      .theme-seg .btn[aria-pressed="true"] {
        background: var(--accent-tint);
        color: var(--accent-text);
        font-weight: 600;
      }

      #sb-foot>.btn {
        width: 100%;
        height: 34px;
        font-size: var(--fs-sm);
      }

      /* ── toolbar ── */
      #toolbar {
        height: 52px;
        padding: 0 16px;
        gap: 8px;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }

      .sw {
        flex: 1;
        position: relative;
        max-width: 440px;
        display: flex;
        align-items: center;
      }

      .sw>svg {
        position: absolute;
        inset-inline-start: 10px;
        color: var(--text-tertiary);
        pointer-events: none;
      }

      #si {
        width: 100%;
        height: 36px;
        background: var(--surface-2);
        border: 1px solid var(--border-control);
        border-radius: var(--r-md);
        color: var(--text-primary);
        padding: 0 12px;
        padding-inline-start: 32px;
        padding-inline-end: 60px;
        font-size: var(--fs-base);
        font-family: inherit;
      }

      #si::placeholder {
        color: var(--text-tertiary);
      }

      .sw kbd.kchip {
        position: absolute;
        inset-inline-end: 8px;
        pointer-events: none;
      }

      .sw:focus-within kbd.kchip {
        display: none;
      }

      #si-clear {
        position: absolute;
        inset-inline-end: 6px;
        width: 26px;
        height: 26px;
        border: none;
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: var(--fs-base);
        line-height: 1;
      }

      #si-clear:hover {
        background: var(--surface-3);
        color: var(--text-primary);
      }

      .tb-sp2 {
        flex: 1;
      }

      .rbtn.spin svg {
        animation: spin 1s linear infinite;
      }

      /* ── tag filter popover (listbox) ── */
      .tag-dd {
        position: relative;
      }

      .tag-dd-list {
        position: absolute;
        top: calc(100% + 4px);
        inset-inline-start: 0;
        min-width: 180px;
        max-height: 280px;
        overflow-y: auto;
        background: var(--surface-2);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-lg);
        z-index: 60;
        padding: 4px;
        box-shadow: var(--shadow-overlay);
        display: none;
      }

      .tag-dd-list.on {
        display: block;
      }

      .tag-dd-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 32px;
        padding: 4px 10px;
        border: none;
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--text-primary);
        font-family: inherit;
        font-size: var(--fs-sm);
        text-align: start;
        cursor: pointer;
        white-space: nowrap;
      }

      .tag-dd-item:hover,
      .tag-dd-item:focus-visible {
        background: var(--surface-3);
      }

      .tag-dd-item .tick {
        width: 14px;
        flex-shrink: 0;
        color: var(--accent-text);
        visibility: hidden;
      }

      .tag-dd-item[aria-selected="true"] {
        color: var(--accent-text);
        font-weight: 600;
      }

      .tag-dd-item[aria-selected="true"] .tick {
        visibility: visible;
      }

      /* ── connection banner ── */
      #conn-banner {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        flex-shrink: 0;
        background: var(--warning-tint);
        border-bottom: 1px solid color-mix(in oklch, var(--warning-text) 35%, transparent);
        color: var(--warning-text);
        font-size: var(--fs-sm);
      }

      #conn-banner .btn {
        height: 28px;
        font-size: var(--fs-xs);
      }

      /* ── content: page headers, grid, cards ── */
      .gv {
        max-width: 1120px;
        margin-inline: auto;
        padding: 32px;
      }

      .gv-hd {
        margin-bottom: 20px;
      }

      .gv-hd h2 {
        font-size: var(--fs-xl);
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 4px;
      }

      .gv-hd p {
        font-size: var(--fs-base);
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }

      .gv-sec {
        font-size: var(--fs-sm);
        font-weight: 600;
        color: var(--text-tertiary);
        margin: 24px 0 12px;
      }

      .gv-sec:first-child {
        margin-top: 0;
      }

      .gg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }

      /* card: article + stretched primary button; tags/actions are sibling
         controls raised above the stretch layer (no nested interactives) */
      .gc {
        position: relative;
        background: var(--surface-2);
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-lg);
        padding: 20px;
        transition: border-color var(--dur-fast) var(--ease-move), background var(--dur-fast) var(--ease-move);
      }

      .gc:hover {
        border-color: var(--border-strong);
        background: var(--surface-3);
      }

      html[data-theme="light"] .gc:hover {
        background: var(--surface-2);
      }

      .gc-open {
        all: unset;
        cursor: pointer;
        display: block;
      }

      .gc-open::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: var(--r-lg);
      }

      .gc:has(.gc-open:focus-visible) {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }

      .gc-h {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 10px;
      }

      .gc-ico {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border-radius: var(--r-md);
        background: var(--accent-tint);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      .gc-title {
        font-size: var(--fs-md);
        font-weight: 600;
        color: var(--text-primary);
        line-height: 1.35;
      }

      .gc-title mark,
      .gc-desc mark {
        background: var(--warning-tint);
        color: inherit;
        border-radius: 3px;
      }

      .gc-cat {
        font-size: var(--fs-sm);
        color: var(--accent-text);
        margin-top: 2px;
      }

      .gc-desc {
        font-size: var(--fs-base);
        color: var(--text-secondary);
        line-height: 1.55;
        margin-bottom: 12px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .gc-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        position: relative;
        z-index: 2;
      }

      .tagbtn {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        font-family: inherit;
        font-size: var(--fs-xs);
        background: var(--surface-3);
        color: var(--text-secondary);
        border: 1px solid var(--border-subtle);
        cursor: pointer;
        transition: color var(--dur-fast), border-color var(--dur-fast);
      }

      html[data-theme="light"] .tagbtn {
        background: var(--surface-0);
      }

      .tagbtn:hover {
        border-color: var(--accent-text);
        color: var(--accent-text);
      }

      .tagbtn.ac {
        background: var(--accent-tint);
        color: var(--accent-text);
        border-color: color-mix(in oklch, var(--accent-bg) 35%, transparent);
      }

      .gc-prog {
        margin-top: 14px;
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .gc-prog .pbar {
        flex: 1;
      }

      .gc-prog .chip {
        flex-shrink: 0;
      }

      /* resume beacon */
      .gc.resume {
        border-color: color-mix(in oklch, var(--accent-bg) 35%, transparent);
      }

      /* skeletons */
      .skel-card {
        background: var(--surface-2);
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-lg);
        padding: 20px;
        min-height: 140px;
      }

      .skel {
        border-radius: var(--r-sm);
        background: var(--surface-3);
        animation: skelpulse 1.4s ease-in-out infinite;
      }

      @keyframes skelpulse {

        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: .55;
        }
      }

      /* empty states */
      .es {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 56px 20px;
        color: var(--text-secondary);
        gap: 10px;
        text-align: center;
      }

      .es-i {
        font-size: 40px;
        opacity: .4;
      }

      .es h3 {
        font-size: var(--fs-md);
        font-weight: 600;
        color: var(--text-primary);
      }

      .es p {
        font-size: var(--fs-base);
        max-width: 280px;
        line-height: 1.5;
      }

      .es .btn {
        margin-top: 6px;
      }

      .ldg {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 56px 20px;
        color: var(--text-secondary);
      }

      .ldg .spinner {
        width: 22px;
        height: 22px;
      }

      /* ── breadcrumbs ── */
      .crumbs {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 18px;
        font-size: var(--fs-sm);
        color: var(--text-tertiary);
      }

      .crumbs button {
        border: none;
        background: none;
        padding: 2px 4px;
        border-radius: var(--r-sm);
        color: var(--accent-text);
        font-family: inherit;
        font-size: var(--fs-sm);
        cursor: pointer;
      }

      .crumbs button:hover {
        text-decoration: underline;
      }

      .crumbs [aria-current="page"] {
        color: var(--text-secondary);
        padding: 2px 4px;
      }

      /* ── guide viewer ── */
      .gview {
        max-width: 760px;
        padding: 0 48px 96px;
        margin-inline-start: 0;
      }

      .gview-hd {
        padding-top: 28px;
      }

      .gview h1 {
        font-size: var(--fs-2xl);
        font-weight: 700;
        line-height: 1.25;
        color: var(--text-primary);
        margin-bottom: 10px;
      }

      .gmeta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .act-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }

      /* sticky mini header */
      .gsticky {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        margin: 0 -48px;
        padding: 0 48px;
        background: color-mix(in srgb, var(--surface-0) 92%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border-subtle);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-6px);
        transition: opacity var(--dur-fast) var(--ease-move), transform var(--dur-fast) var(--ease-move);
      }

      .gsticky.vis {
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }

      .gsticky .t {
        font-size: var(--fs-sm);
        font-weight: 600;
        color: var(--text-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 40%;
      }

      .gsticky .pbar {
        width: 90px;
        flex-shrink: 0;
      }

      .gsticky .cnt {
        font-size: var(--fs-xs);
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
      }

      .gsticky .nextbtn {
        margin-inline-start: auto;
        max-width: 45%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        display: block;
      }

      /* progress block */
      .pblock {
        margin: 18px 0 24px;
      }

      .pbar-l {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: var(--fs-sm);
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        margin-bottom: 6px;
      }

      .pbar-l .done-lbl {
        color: var(--success-text);
        font-weight: 600;
      }

      .pbar {
        height: 6px;
        background: var(--surface-3);
        border-radius: 999px;
        overflow: hidden;
      }

      .pfill {
        height: 100%;
        border-radius: 999px;
        background: var(--success-text);
        transition: width var(--dur-standard) var(--ease-move);
      }

      .pmeta {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      .pmeta .note {
        font-size: var(--fs-xs);
        color: var(--text-tertiary);
      }

      .notice {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--accent-tint);
        border-radius: var(--r-md);
        padding: 8px 12px;
        font-size: var(--fs-sm);
        color: var(--accent-text);
        margin: 12px 0;
      }

      .notice button {
        margin-inline-start: auto;
      }

      /* steps + progress rail */
      .steps-lbl {
        font-size: var(--fs-sm);
        font-weight: 600;
        color: var(--text-tertiary);
        margin: 20px 0 12px;
      }

      .steps {
        position: relative;
      }

      /* steps rail removed — no vertical connector between step markers */

      .step {
        display: grid;
        grid-template-columns: 44px 1fr;
        margin-bottom: 8px;
        position: relative;
      }

      .chk-wrap {
        position: relative;
        height: 52px;
        display: flex;
        align-items: center;
      }

      .chk-input {
        position: absolute;
        inset-inline-start: 0;
        top: 6px;
        width: 40px;
        height: 40px;
        opacity: 0;
        cursor: pointer;
        margin: 0;
        z-index: 2;
      }

      .chk {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid var(--border-control);
        background: var(--surface-0);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--fs-xs);
        font-weight: 700;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        position: relative;
        z-index: 1;
        transition: background var(--dur-instant) var(--ease-move), border-color var(--dur-instant) var(--ease-move);
      }

      .chk-input:hover+.chk {
        border-color: var(--accent-text);
      }

      .chk-input:focus-visible+.chk {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }

      .chk-input:checked+.chk {
        background: var(--success-solid);
        border-color: var(--success-solid);
        color: var(--on-success);
      }

      .chk .tick {
        display: none;
      }

      .chk-input:checked+.chk .num {
        display: none;
      }

      .chk-input:checked+.chk .tick {
        display: block;
      }

      .step-main {
        background: var(--surface-2);
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-lg);
        overflow: hidden;
        transition: border-color var(--dur-fast) var(--ease-move);
      }

      .step.open .step-main {
        border-color: var(--border-strong);
      }

      .step.now .step-main {
        border-inline-start: 3px solid var(--accent-text);
      }

      .step.done .step-main {
        background: color-mix(in srgb, var(--success-tint) 35%, var(--surface-2));
      }

      .step-hd {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 52px;
        padding: 12px 16px;
        border: none;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        text-align: start;
        color: var(--text-primary);
        transition: background var(--dur-fast);
      }

      .step-hd:hover {
        background: var(--surface-3);
      }

      .step-hd:focus-visible {
        outline-offset: -2px;
      }

      .step.now .step-hd {
        background: var(--accent-tint);
      }

      .stitle {
        flex: 1;
        font-size: var(--fs-md);
        font-weight: 500;
      }

      .step.done .stitle {
        color: var(--text-tertiary);
      }

      /* no strikethrough: operators re-read done steps */
      .now-chip {
        display: none;
      }

      .step.now .now-chip {
        display: inline-flex;
      }

      .schev {
        color: var(--text-tertiary);
        font-size: var(--fs-base);
        flex-shrink: 0;
        transition: transform var(--dur-standard) var(--ease-move);
        display: inline-block;
      }

      .step.open .schev {
        transform: rotate(-90deg);
      }

      .sbody {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows var(--dur-standard) var(--ease-move);
      }

      .step.open .sbody {
        grid-template-rows: 1fr;
      }

      .sbody-in {
        overflow: hidden;
        min-height: 0;
      }

      .sbody-pad {
        padding: 16px 20px 20px;
        border-top: 1px solid var(--border-subtle);
      }

      /* ── markdown prose ── */
      .md {
        font-size: var(--fs-md);
        line-height: 1.7;
        color: var(--text-primary);
      }

      .md h1,
      .md h2,
      .md h3 {
        color: var(--text-primary);
        font-weight: 600;
        margin: 24px 0 8px;
      }

      .md h1 {
        font-size: var(--fs-xl);
      }

      .md h2 {
        font-size: var(--fs-xl);
      }

      .md h3 {
        font-size: var(--fs-lg);
      }

      .md> :first-child {
        margin-top: 0;
      }

      .md p {
        margin-bottom: 10px;
      }

      .md code {
        font-size: 13px;
        background: var(--surface-3);
        border: 1px solid var(--border-subtle);
        border-radius: 4px;
        padding: 1px 6px;
        color: var(--accent-text);
      }

      .codewrap {
        position: relative;
        margin: 10px 0;
      }

      .md pre {
        background: var(--surface-1);
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-md);
        padding: 14px 16px;
        overflow-x: auto;
      }

      html[data-theme="light"] .md pre {
        background: var(--surface-3);
      }

      .md pre code {
        background: none;
        border: none;
        padding: 0;
        color: var(--text-primary);
        font-size: 13px;
        line-height: 1.6;
      }

      /* physical right: inside an LTR code island the conventional corner is top-right */
      .copybtn {
        position: absolute;
        top: 8px;
        right: 8px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 26px;
        padding: 0 9px;
        border-radius: var(--r-sm);
        border: 1px solid var(--border-strong);
        background: var(--surface-2);
        color: var(--text-secondary);
        font-family: inherit;
        font-size: var(--fs-xs);
        cursor: pointer;
        opacity: 0;
        transition: opacity var(--dur-fast);
      }

      .codewrap:hover .copybtn,
      .copybtn:focus-visible {
        opacity: 1;
      }

      .copybtn:hover {
        color: var(--text-primary);
        background: var(--surface-3);
      }

      .copybtn.ok {
        color: var(--success-text);
        border-color: color-mix(in oklch, var(--success-text) 40%, transparent);
        opacity: 1;
      }

      .md ul,
      .md ol {
        padding-inline-start: 22px;
        margin-bottom: 10px;
      }

      .md li {
        margin-bottom: 5px;
      }

      .md blockquote {
        border-inline-start: 3px solid var(--accent-text);
        padding: 8px 14px;
        margin: 10px 0;
        color: var(--text-secondary);
        background: var(--accent-tint);
        border-radius: var(--r-sm);
      }

      .md a {
        color: var(--accent-text);
      }

      .md table {
        width: 100%;
        border-collapse: collapse;
        margin: 10px 0;
        font-size: var(--fs-sm);
      }

      .md th,
      .md td {
        border: 1px solid var(--border-subtle);
        padding: 7px 12px;
        text-align: start;
      }

      .md th {
        background: var(--surface-2);
        color: var(--text-primary);
        font-weight: 600;
      }

      .md hr {
        border: none;
        border-top: 1px solid var(--border-subtle);
        margin: 16px 0;
      }

      .md img {
        max-width: 100%;
        border-radius: var(--r-md);
        border: 1px solid var(--border-subtle);
        margin: 10px 0;
        display: block;
      }

      .img-warn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-xs);
        color: var(--warning-text);
        padding: 5px 10px;
        background: var(--warning-tint);
        border: 1px solid color-mix(in oklch, var(--warning-text) 30%, transparent);
        border-radius: var(--r-sm);
        margin: 4px 0;
      }

      /* ── log panel ── */
      #lp {
        border-top: 1px solid var(--border-subtle);
        background: var(--surface-1);
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        height: 200px;
        transition: height var(--dur-standard) var(--ease-move);
      }

      #lp.col {
        height: 33px;
      }

      #lp.col #lo {
        display: none;
      }

      #lh {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        height: 32px;
        flex-shrink: 0;
        width: 100%;
        border: none;
        border-bottom: 1px solid var(--border-subtle);
        background: transparent;
        cursor: pointer;
        font-family: inherit;
      }

      #lp.col #lh {
        border-bottom: none;
      }

      #lh:focus-visible {
        outline-offset: -2px;
      }

      .ldot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-tertiary);
        flex-shrink: 0;
      }

      .ldot.live {
        background: var(--success-text);
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {

        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: .35;
        }
      }

      .ltitle {
        font-size: var(--fs-xs);
        font-weight: 600;
        color: var(--text-secondary);
      }

      #lbadge {
        display: none;
      }

      #lbadge.on {
        display: inline-flex;
      }

      .lsp {
        flex: 1;
      }

      .lbtn {
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        border-radius: var(--r-sm);
      }

      .lbtn:hover {
        background: var(--surface-3);
        color: var(--text-primary);
      }

      #ltogico {
        transition: transform var(--dur-standard) var(--ease-move);
        color: var(--text-secondary);
      }

      #lp.col #ltogico {
        transform: rotate(180deg);
      }

      #lo {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 12.5px;
        line-height: 1.6;
      }

      .ll {
        display: flex;
        gap: 8px;
        padding: 0 4px;
        border-radius: 3px;
      }

      .ll.e {
        background: var(--danger-tint);
      }

      .lt {
        color: var(--text-tertiary);
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }

      .lx {
        word-break: break-all;
        color: var(--text-secondary);
      }

      .lx.e {
        color: var(--danger-text);
      }

      .lx.s {
        color: var(--accent-text);
      }

      /* ── dialogs ── */
      dialog {
        background: var(--surface-2);
        color: var(--text-primary);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-xl);
        box-shadow: var(--shadow-overlay);
        padding: 0;
        margin: auto;
      }

      dialog::backdrop {
        background: var(--scrim);
        backdrop-filter: blur(2px);
      }

      dialog[open] {
        opacity: 1;
        transform: none;
        transition: opacity var(--dur-emph) var(--ease-enter), transform var(--dur-emph) var(--ease-enter);
      }

      @starting-style {
        dialog[open] {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      .dlg-hd {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px;
        height: 56px;
        border-bottom: 1px solid var(--border-subtle);
        flex-shrink: 0;
      }

      .dlg-hd h2 {
        font-size: var(--fs-lg);
        font-weight: 600;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dirty-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-text);
        display: none;
      }

      .dirty-dot.on {
        display: inline-block;
      }

      .dlg-close {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .dlg-close:hover {
        background: var(--surface-3);
        color: var(--text-primary);
      }

      .dlg-bd {
        padding: 20px;
        overflow-y: auto;
        flex: 1;
      }

      .dlg-ft {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 20px;
        min-height: 60px;
        border-top: 1px solid var(--border-subtle);
        flex-shrink: 0;
      }

      .dlg-ft .sp {
        flex: 1;
      }

      .dlg-err {
        color: var(--danger-text);
        font-size: var(--fs-sm);
        display: none;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .dlg-err.on {
        display: flex;
      }

      /* editor dialog */
      #ed-dialog {
        width: 840px;
        max-width: 95vw;
        height: 88vh;
        max-height: 88vh;
      }

      #ed-dialog[open] {
        display: flex;
        flex-direction: column;
      }

      #ed-dialog .dlg-bd {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .helper-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        font-size: var(--fs-xs);
        color: var(--text-tertiary);
        padding: 6px 10px;
        background: var(--surface-3);
        border-radius: var(--r-sm);
      }

      .helper-bar code {
        font-size: 11px;
        background: var(--surface-2);
        border: none;
        padding: 1px 5px;
        border-radius: 3px;
        color: var(--accent-text);
      }

      .ed {
        width: 100%;
        flex: 1;
        min-height: 300px;
        background: var(--surface-1);
        border: 1px solid var(--border-control);
        border-radius: var(--r-md);
        color: var(--text-primary);
        padding: 14px 16px;
        font-size: 13px;
        line-height: 1.7;
        resize: none;
      }

      html[data-theme="light"] .ed {
        background: var(--surface-0);
      }

      .icon-row {
        display: flex;
        align-items: center;
        gap: 10px;
        position: relative;
      }

      .icon-cur {
        font-size: 20px;
        width: 40px;
        height: 38px;
        padding: 0;
      }

      .icon-hint {
        font-size: var(--fs-xs);
        color: var(--text-tertiary);
      }

      .icon-pick {
        position: absolute;
        top: calc(100% + 4px);
        inset-inline-start: 0;
        z-index: 20;
        background: var(--surface-2);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-lg);
        padding: 8px;
        box-shadow: var(--shadow-overlay);
        display: none;
      }

      .icon-pick.on {
        display: block;
      }

      .icon-pick-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 2px;
      }

      .icon-pick-grid button {
        font-size: 17px;
        width: 36px;
        height: 36px;
        border: none;
        background: transparent;
        cursor: pointer;
        border-radius: var(--r-sm);
        line-height: 1;
      }

      .icon-pick-grid button:hover {
        background: var(--surface-3);
      }

      /* admin dialog */
      #ap-dialog {
        width: 820px;
        max-width: 95vw;
        max-height: 84vh;
      }

      #ap-dialog[open] {
        display: flex;
        flex-direction: column;
      }

      #ap-chips {
        display: flex;
        gap: 6px;
      }

      .ap-filter {
        border: 1px solid transparent;
        cursor: pointer;
        font-family: inherit;
      }

      .ap-filter[aria-pressed="true"] {
        border-color: currentColor;
      }

      #ap-dialog .dlg-bd {
        padding: 0;
      }

      .ap-table {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--fs-base);
      }

      .ap-table th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border-strong);
        padding: 0;
        text-align: start;
      }

      .ap-table th button {
        display: flex;
        align-items: center;
        gap: 5px;
        width: 100%;
        padding: 10px 16px;
        border: none;
        background: transparent;
        font-family: inherit;
        font-size: var(--fs-sm);
        font-weight: 600;
        color: var(--text-secondary);
        cursor: pointer;
        text-align: start;
      }

      .ap-table th button:hover {
        color: var(--text-primary);
      }

      .ap-table td {
        padding: 8px 16px;
        border-bottom: 1px solid var(--border-subtle);
        vertical-align: middle;
        height: 44px;
      }

      .ap-table tr:last-child td {
        border-bottom: none;
      }

      .ap-table tbody tr:hover td {
        background: var(--surface-3);
      }

      .ap-table tr.stale td:first-child {
        border-inline-start: 3px solid var(--danger-text);
      }

      .ap-table tr.aging td:first-child {
        border-inline-start: 3px solid var(--warning-text);
      }

      .ap-title-btn {
        border: none;
        background: none;
        padding: 0;
        font-family: inherit;
        font-size: var(--fs-base);
        font-weight: 500;
        color: var(--text-primary);
        cursor: pointer;
        text-align: start;
      }

      .ap-title-btn:hover {
        color: var(--accent-text);
        text-decoration: underline;
      }

      .ap-path {
        font-size: var(--fs-sm);
        color: var(--text-tertiary);
        font-family: "Cascadia Code", Consolas, monospace;
      }

      /* confirm dialog */
      #cf-dialog {
        width: 400px;
        max-width: 92vw;
      }

      #cf-dialog .dlg-bd {
        font-size: var(--fs-base);
        color: var(--text-secondary);
        line-height: 1.6;
      }

      #cf-dialog .dlg-bd strong {
        color: var(--text-primary);
      }

      /* floating icon picker (sidebar category icons) */
      #float-icon-picker {
        position: fixed;
        display: none;
        z-index: 600;
        background: var(--surface-2);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-lg);
        padding: 8px;
        box-shadow: var(--shadow-overlay);
      }

      #float-icon-picker.on {
        display: block;
      }

      /* ── toasts (bottom-inline-end = away from sidebar) ── */
      #toasts {
        position: fixed;
        bottom: 44px;
        inset-inline-end: 16px;
        z-index: 700;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 360px;
      }

      .toast {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        background: var(--surface-2);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-lg);
        padding: 12px 14px;
        box-shadow: var(--shadow-overlay);
        font-size: var(--fs-sm);
        color: var(--text-primary);
        opacity: 1;
        transform: none;
        transition: opacity var(--dur-emph) var(--ease-enter), transform var(--dur-emph) var(--ease-enter);
      }

      @starting-style {
        .toast {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      .toast.out {
        opacity: 0;
        transition: opacity var(--dur-fast) var(--ease-exit);
      }

      .toast .tico {
        flex-shrink: 0;
        font-weight: 700;
      }

      .toast.success .tico {
        color: var(--success-text);
      }

      .toast.error .tico {
        color: var(--danger-text);
      }

      .toast.error {
        border-color: color-mix(in oklch, var(--danger-text) 40%, transparent);
      }

      .toast .tmsg {
        flex: 1;
        min-width: 0;
        overflow-wrap: break-word;
      }

      .toast .tact {
        border: none;
        background: none;
        color: var(--accent-text);
        font-family: inherit;
        font-size: var(--fs-sm);
        font-weight: 600;
        cursor: pointer;
        padding: 0 4px;
        flex-shrink: 0;
      }

      .toast .tact:hover {
        text-decoration: underline;
      }

      .toast .tclose {
        border: none;
        background: none;
        color: var(--text-tertiary);
        cursor: pointer;
        padding: 0 2px;
        font-size: var(--fs-base);
        line-height: 1;
        flex-shrink: 0;
      }

      .toast .tclose:hover {
        color: var(--text-primary);
      }

      /* ── reduced motion: keep state changes, drop movement ── */
      @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
        }

        dialog[open],
        .toast {
          transition-duration: 100ms !important;
          transform: none !important;
        }

        .skel {
          animation: none;
          opacity: .7;
        }

        .ldot.live {
          animation: none;
        }

        .rbtn.spin svg {
          animation: none;
        }

        #ct {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>

  <body>

    <!-- TITLEBAR -->
    <div id="tb">
      <div class="tb-logo">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
        מדריך Pipeline
      </div>
      <span class="chip" id="conn-chip"><span class="dot" aria-hidden="true"></span><span id="cl">מנותק</span></span>
      <div class="tb-sp"></div>
      <button class="tb-btn" onclick="api.minimize()" aria-label="מזעור">
        <svg width="12" height="2" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 12 2" aria-hidden="true">
          <line x1="0" y1="1" x2="12" y2="1" />
        </svg>
      </button>
      <button class="tb-btn" onclick="api.maximize()" aria-label="הגדלה">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 11 11" aria-hidden="true">
          <rect x=".5" y=".5" width="10" height="10" rx="2" />
        </svg>
      </button>
      <button class="tb-btn x" onclick="api.close()" aria-label="סגירה">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 11 11" aria-hidden="true">
          <line x1="1" y1="1" x2="10" y2="10" />
          <line x1="10" y1="1" x2="1" y2="10" />
        </svg>
      </button>
    </div>

    <!-- LOGIN -->
    <div id="ls" class="sc on">
      <form class="card" id="login-form" onsubmit="app.connect(); return false;" novalidate>
        <div class="card-title">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          התחברות לשרת המדריכים
        </div>
        <div class="card-sub">הזן את פרטי השרת ואישורי הכניסה</div>

        <div class="fr">
          <label for="fh">כתובת שרת ופורט</label>
          <div class="split">
            <input type="text" id="fh" placeholder="שם מארח או IP" autocomplete="off" class="ltr">
            <input type="number" id="fp" value="7842" placeholder="7842" class="num ltr" aria-label="פורט">
          </div>
        </div>
        <div class="fr">
          <label for="fu">שם משתמש</label>
          <input type="text" id="fu" placeholder="שם משתמש" autocomplete="username">
        </div>
        <div class="fr">
          <label for="fpass">סיסמה</label>
          <input type="password" id="fpass" placeholder="••••••••" autocomplete="current-password">
        </div>

        <div id="lerr" class="err-box" role="alert" tabindex="-1"></div>
        <button type="submit" class="btn primary" id="cbtn">התחבר</button>
      </form>
    </div>

    <!-- APP -->
    <div id="as" class="sc">
      <div id="ws">
        <nav id="sb" aria-label="ניווט מדריכים">
          <div class="sb-sec">
            <div class="sb-lbl">עיון</div>
            <div class="sb-row" id="nall">
              <button class="sb-item" onclick="app.nav.home()">
                <span class="sb-ico" aria-hidden="true">🏠</span><span class="sb-txt">דף הבית</span>
                <span class="badge num" id="ball">0</span>
              </button>
            </div>
            <div class="sb-row" id="nrec">
              <button class="sb-item" onclick="app.nav.recent()">
                <span class="sb-ico" aria-hidden="true">🕐</span><span class="sb-txt">נצפו לאחרונה</span>
              </button>
            </div>
          </div>
          <div class="sb-sec sb-scroll">
            <div class="sb-lbl" id="cats-lbl">קטגוריות</div>
            <div id="cats"></div>
          </div>
          <div id="sb-foot">
            <div class="ci"><span aria-hidden="true">🔒</span><span id="cinfo">—</span></div>
            <div class="theme-seg" role="group" aria-label="ערכת נושא">
              <button class="btn" data-t="system" aria-pressed="false" onclick="app.setTheme('system')">מערכת</button>
              <button class="btn" data-t="dark" aria-pressed="true" onclick="app.setTheme('dark')">כהה</button>
              <button class="btn" data-t="light" aria-pressed="false" onclick="app.setTheme('light')">בהיר</button>
            </div>
            <button class="btn outline" id="ap-btn" hidden onclick="app.admin.open()">📋 רעננות מדריכים</button>
            <button class="btn ghost-danger" onclick="app.disconnect()">⏏ התנתק</button>
          </div>
        </nav>

        <div id="main">
          <div id="toolbar">
            <button class="btn sm" id="back-btn" hidden onclick="app.nav.back()">חזרה ›</button>
            <div class="sw">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input type="text" id="si" placeholder="חיפוש בכל המדריכים…" aria-label="חיפוש בכל המדריכים" oninput="app.onSearch(this.value)">
              <kbd class="kchip ltr" aria-hidden="true">Ctrl+K</kbd>
              <button id="si-clear" hidden onclick="app.clearSearch()" aria-label="נקה חיפוש">✕</button>
            </div>
            <div class="tag-dd" id="tag-dd">
              <button class="btn sm outline" id="tag-dd-btn" aria-haspopup="listbox" aria-expanded="false" onclick="app.sidebar.togTagDd(event)">כל התגים
                ▾</button>
              <div class="tag-dd-list" id="tag-dd-list" role="listbox" aria-label="סינון לפי תג" tabindex="-1"></div>
            </div>
            <div class="tb-sp2"></div>
            <button class="btn sm tinted" id="ngb" hidden onclick="app.editor.open('create')">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              מדריך חדש
            </button>
            <button class="btn sm rbtn" id="rb" onclick="app.loadGuides()">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M23 4v6h-6M1 20v-6h6" />
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
              </svg>
              רענן
            </button>
          </div>
          <div id="conn-banner" hidden>
            <span aria-hidden="true">⚠</span>
            <span>החיבור לשרת אבד — התוכן הפתוח נשאר זמין.</span>
            <button class="btn outline" onclick="app.retryConnection()">נסה שוב</button>
            <button class="btn" onclick="app.disconnect()">התחבר מחדש</button>
          </div>
          <div id="ct"></div>
        </div>
      </div>

      <div id="lp" class="col">
        <button id="lh" onclick="app.logger.toggle()" aria-expanded="false" aria-controls="lo">
          <span class="ldot" id="ldot" aria-hidden="true"></span>
          <span class="ltitle">יומן פלט</span>
          <span class="chip bad" id="lbadge"><span id="lbadge-n">0</span> שגיאות</span>
          <span class="lsp"></span>
          <span class="lbtn" role="button" tabindex="0" aria-label="נקה יומן" onclick="app.logger.clear(event)"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();app.logger.clear(event)}">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6l-1 14H6L5 6" />
              <path d="M10 11v6M14 11v6M9 6V4h6v2" />
            </svg>
          </span>
          <svg id="ltogico" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="18 15 12 9 6 15" />
          </svg>
        </button>
        <div id="lo"></div>
      </div>
    </div>

    <!-- GUIDE EDITOR -->
    <dialog id="ed-dialog" aria-labelledby="em-title">
      <div class="dlg-hd">
        <h2><span id="em-title">מדריך חדש</span> <span class="dirty-dot" id="em-dirty" title="שינויים שלא נשמרו"></span></h2>
        <button class="dlg-close" onclick="app.editor.requestClose()" aria-label="סגירה">✕</button>
      </div>
      <div class="dlg-bd">
        <div class="fr" style="margin:0">
          <label for="em-path">נתיב (יחסי לתיקיית המדריכים)</label>
          <input type="text" id="em-path" class="ltr" placeholder="category/sub-folder/guide.md" autocomplete="off" oninput="app.editor.validatePath()">
          <div class="msg" id="em-path-msg" role="status"></div>
        </div>
        <div class="fr icon-row" style="margin:0">
          <button type="button" class="btn outline icon-cur" id="em-icon-btn" onclick="app.editor.togIcons(event)" aria-haspopup="true" aria-expanded="false"
            aria-label="בחר אייקון למדריך">📄</button>
          <span class="icon-hint">אייקון — נשמר ב-frontmatter</span>
          <div class="icon-pick" id="em-icon-picker">
            <div class="icon-pick-grid" id="em-icon-grid"></div>
          </div>
        </div>
        <div class="helper-bar"><span aria-hidden="true">💡</span><span>כל כותרת <code>## שם השלב</code> הופכת לשלב עם סימון השלמה</span></div>
        <textarea class="ed" id="em-content" aria-label="תוכן המדריך (Markdown)" placeholder="# Guide Title&#10;&#10;## Step 1: ...&#10;&#10;Description here."
          oninput="app.editor.markDirty()"></textarea>
      </div>
      <div class="dlg-ft">
        <button class="btn sm outline" id="em-img" onclick="app.editor.insertImage()">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
          הוסף תמונה
        </button>
        <span class="dlg-err" id="em-err" role="alert"></span>
        <span class="sp"></span>
        <button class="btn sm" onclick="app.editor.requestClose()">ביטול</button>
        <button class="btn primary sm" id="em-save" onclick="app.editor.save()" style="min-width:96px">שמור</button>
      </div>
    </dialog>

    <!-- ADMIN: GUIDE FRESHNESS -->
    <dialog id="ap-dialog" aria-labelledby="ap-title">
      <div class="dlg-hd">
        <h2 id="ap-title">📋 רעננות מדריכים</h2>
        <div id="ap-chips"></div>
        <button class="dlg-close" onclick="app.admin.close()" aria-label="סגירה">✕</button>
      </div>
      <div class="dlg-bd">
        <table class="ap-table" id="ap-table">
          <thead>
            <tr>
              <th id="apth-title"><button onclick="app.admin.sort('title')">כותרת <span aria-hidden="true" id="aps-title"></span></button></th>
              <th id="apth-path"><button onclick="app.admin.sort('path')">נתיב <span aria-hidden="true" id="aps-path"></span></button></th>
              <th id="apth-updatedAt"><button onclick="app.admin.sort('updatedAt')">עודכן לאחרונה <span aria-hidden="true" id="aps-updatedAt">▼</span></button>
              </th>
              <th id="apth-age"><button onclick="app.admin.sort('age')">גיל <span aria-hidden="true" id="aps-age"></span></button></th>
            </tr>
          </thead>
          <tbody id="ap-tbody"></tbody>
        </table>
      </div>
    </dialog>

    <!-- CONFIRM -->
    <dialog id="cf-dialog" aria-labelledby="cf-title">
      <div class="dlg-hd">
        <h2 id="cf-title">אישור</h2>
      </div>
      <div class="dlg-bd" id="cf-body"></div>
      <div class="dlg-ft">
        <span class="sp"></span>
        <button class="btn sm" id="cf-cancel">ביטול</button>
        <button class="btn danger sm" id="cf-ok">אישור</button>
      </div>
    </dialog>

    <!-- floating icon picker (category icons) -->
